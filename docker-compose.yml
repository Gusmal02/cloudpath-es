services:
  backend:
    build: ./backend
    volumes:
      # Mount only persistent data directories — questions/ stays from the image
      - cloudpath_db:/app/data/db
      - cloudpath_chroma:/app/data/chroma
    environment:
      CLOUDPATH_DB_PATH: data/db/cloudpath.db
      CLOUDPATH_CHROMA_PATH: data/chroma
      CLOUDPATH_QUESTIONS_DIR: data/questions
      CLOUDPATH_PORT_FILE: data/db/.port
      CLOUDPATH_RELOAD: "false"
      # For Ollama running on the host machine
      OLLAMA_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  cloudpath_db:
  cloudpath_chroma:
