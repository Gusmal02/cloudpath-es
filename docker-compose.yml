services:
  backend:
    build: ./backend
    volumes:
      - ./data:/app/data
    environment:
      CLOUDPATH_DB_PATH: data/cloudpath.db
      CLOUDPATH_CHROMA_PATH: data/chroma
      CLOUDPATH_QUESTIONS_DIR: data/questions
      CLOUDPATH_PORT_FILE: data/.port
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes: {}
